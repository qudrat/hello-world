<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello, World!</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 4rem;
      margin: 0;
      letter-spacing: 2px;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
    }
    p {
      margin: 1.25rem 0 0;
      font-size: 1.25rem;
      opacity: 0.85;
      letter-spacing: 0.5px;
    }
    .version {
      margin-top: 2rem;
      font-size: 0.95rem;
      letter-spacing: 1px;
      opacity: 0.7;
      font-family: "Cascadia Code", Consolas, monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hello, World!</h1>
    <p>GitHub Pages orqali jonli sayt</p>
    <p class="version"><span class="version-number">v1.1.1</span></p>
  </div>
  <script>
    // Eng so'nggi reliz raqamini GitHub API'dan avtomatik olib kelamiz.
    // So'rov muvaffaqiyatsiz bo'lsa, release.py yozgan statik qiymat qoladi.
    (function () {
      var target = document.querySelector(".version-number");
      if (!target || !window.fetch) return;
      fetch("https://api.github.com/repos/qudrat/hello-world/releases/latest", {
        headers: { Accept: "application/vnd.github+json" }
      })
        .then(function (response) {
          if (!response.ok) throw new Error("HTTP " + response.status);
          return response.json();
        })
        .then(function (release) {
          if (!release || !release.tag_name) return;
          target.textContent = release.tag_name;
          target.title = release.name || release.tag_name;
        })
        .catch(function () {
          /* statik qiymat qoladi */
        });
    })();
  </script>
</body>
</html>
